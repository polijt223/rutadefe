name: rutadefe
description: Ruta de Fe - App cristiana de reflexión y material espiritual
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  youtube_player_iframe: ^5.2.1
  pdfx: ^2.6.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.4
  intl: ^0.19.0
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  path: ^1.9.0
  http: ^1.2.0
  open_file: ^3.3.2
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
dependency_overrides:
  flutter_inappwebview_android: 1.1.3